<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Web Manifest -->
    <!-- <link rel="manifest" href="/manifest.webmanifest" /> -->

    <!-- iOS Safari Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="M&V Turnos" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="theme-color" content="#2eb086" />

    <!-- Viewport adaptado a notch / safe-areas -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>M&V Turnos - Gestión Odontológica</title>

    <!-- Fuente elegante 'Satisfy' para la marca M&V con ampersand clásico -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap"
      rel="stylesheet"
    />

    <!-- Estilos críticos para el Splash Screen inmediato sin parpadeos y 100% blanco -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
      }

      #splash-screen,
      .splash-container,
      .pantalla-carga {
        position: fixed !important;
        inset: 0 !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background-color: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        z-index: 99999 !important;
        transition:
          opacity 0.4s ease,
          visibility 0.4s ease;
      }

      #splash-screen.oculto,
      .splash-container.oculto,
      .pantalla-carga.oculto {
        opacity: 0;
        visibility: hidden;
      }

      .splash-logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }

      .splash-logo {
        width: 95px;
        height: 95px;
        object-fit: contain;
        display: block;
      }

      .splash-titulo,
      .splash-title,
      .loading-brand-text {
        font-family: "Satisfy", cursive;
        font-size: 3.2rem;
        color: #2eb086;
        letter-spacing: 2px;
        margin: 1rem 0 0.5rem 0;
        line-height: 1.1;
        text-align: center;
      }

      .splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(46, 176, 134, 0.2);
        border-top-color: #2eb086;
        border-radius: 50%;
        animation: spinnerGiro 0.8s linear infinite;
        margin-top: 0.5rem;
      }

      @keyframes spinnerGiro {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script>
      // Previene el zoom por gesto (pinch-to-zoom) en Safari iOS
      document.addEventListener("gesturestart", function (e) {
        e.preventDefault();
      });
    </script>
  </head>
  <body>
    <!-- Splash Screen inmediato 100% pantalla completa blanco -->
    <div id="splash-screen" class="splash-container pantalla-carga">
      <div class="splash-logo-container">
        <img src="/logo.png" alt="M&V" class="splash-logo" />
        <h1 class="splash-titulo loading-brand-text splash-title">M&V</h1>
        <div class="splash-spinner" aria-hidden="true"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
